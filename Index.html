<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="PRIME 8BP STORE — Premium BOSS MODZ & SHARK AIM access with instant delivery and 24/7 support.">
<meta name="theme-color" content="#07080c">
<title>PRIME 8BP STORE — Premium Access</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/qL7ML5Mq/1000170419.png">

<style>
:root {
  --bg: #07080c;
  --surface: #0f1219;
  --surface-2: #161a23;
  --surface-3: #1c212c;
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.10);
  --border-red: rgba(255, 77, 0, 0.25);
  --border-gold: rgba(255, 184, 0, 0.32);
  --red: #ff4d00;
  --red-soft: #ff7b00;
  --red-deep: #990000;
  --red-glow: rgba(255, 77, 0, 0.5);
  --grad-red: linear-gradient(135deg, #ff4d00 0%, #990000 100%);
  --grad-fire: linear-gradient(135deg, #ffcc00 0%, #ff4d00 50%, #990000 100%);
  --grad-gold: linear-gradient(135deg, #ffd54a 0%, #ff8a00 100%);
  --gold: #ffb800;
  --cyan: #4da6ff;
  --tg: linear-gradient(135deg, #2aabee 0%, #0088cc 100%);
  --wa: linear-gradient(135deg, #3ddc78 0%, #128c7e 100%);
  --text: #ffffff;
  --text-muted: #8b93a5;
  --text-dim: #5a6274;
  --text-faint: #3d4454;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-full: 999px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 77, 0, 0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255, 77, 0, 0.10) 0%, transparent 60%);
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 18px 0;
}
@media (min-width: 560px) {
  .page { padding: 40px 24px 0; }
}
.hero { text-align: center; padding-bottom: 8px; }
.logo-ring { position: relative; display: inline-block; margin-bottom: 22px; isolation: isolate; }
.logo-ring::before {
  content: '';
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 77, 0, 0.55) 0%, transparent 70%);
  z-index: -2;
  animation: pulseGlow 3s ease-in-out infinite;
}
.logo-ring::after {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 2px dashed rgba(255, 77, 0, 0.85);
  z-index: -1;
  animation: spin 10s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}
.logo {
  width: 116px;
  height: 116px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 77, 0, 0.6);
  background: var(--surface);
  box-shadow: 0 0 30px rgba(255, 77, 0, 0.3);
}
.brand {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 2.5px;
  line-height: 1.1;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 20%, #ff7b00 60%, #ff4d00 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 16px rgba(255, 77, 0, 0.5));
  margin-bottom: 10px;
}
.tagline {
  font-size: 13.5px;
  color: var(--text-muted);
  max-width: 320px;
  margin: 0 auto 20px;
  line-height: 1.55;
}
.trust { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.trust-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
}
.trust-pill svg { width: 12px; height: 12px; color: var(--red); flex-shrink: 0; }
.contact { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; }
.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 50px;
  padding: 14px 20px;
  border-radius: var(--r-md);
  font-size: 14.5px;
  font-weight: 800;
  letter-spacing: 0.3px;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.14);
  transition: transform 0.18s var(--ease), box-shadow 0.22s var(--ease), filter 0.18s var(--ease);
  overflow: hidden;
}
.btn svg { width: 19px; height: 19px; flex-shrink: 0; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
.btn:active { transform: translateY(0) scale(0.985); }
.btn-tg { background: var(--tg); box-shadow: 0 8px 24px rgba(42, 171, 238, 0.28); }
.btn-wa { background: var(--wa); box-shadow: 0 8px 24px rgba(61, 220, 120, 0.24); }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.section-head::before {
  content: '';
  width: 3px;
  height: 18px;
  background: var(--grad-fire);
  border-radius: 2px;
  box-shadow: 0 0 10px var(--red-glow);
  flex-shrink: 0;
}
.section-title {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #fff;
}
.tabs {
  display: flex;
  gap: 4px;
  padding: 5px;
  background: rgba(15, 18, 25, 0.9);
  border: 1px solid var(--border-red);
  border-radius: var(--r-lg);
  margin-bottom: 20px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 8px;
  border-radius: 11px;
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.7px;
  color: var(--text-dim);
  transition: all 0.25s var(--ease);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.tab-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: all 0.25s var(--ease);
  flex-shrink: 0;
}
.tab.is-active {
  background: var(--grad-red);
  color: #fff;
  box-shadow: 0 4px 18px rgba(255, 77, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.tab.is-active .tab-dot { background: #fff; box-shadow: 0 0 8px #fff; }
.tab:not(.is-active):hover { color: var(--text-muted); background: rgba(255, 255, 255, 0.03); }
.panel { display: none; }
.panel.is-active { display: block; animation: panelIn 0.35s var(--ease-out); }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.plan {
  position: relative;
  background: linear-gradient(180deg, var(--surface) 0%, #0c0f16 100%);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 18px 16px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.22s var(--ease), box-shadow 0.22s var(--ease), transform 0.22s var(--ease);
}
.plan::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--grad-fire);
  opacity: 0.85;
}
.plan:hover {
  border-color: var(--border-red);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 77, 0, 0.12);
  transform: translateY(-2px);
}
.plan--featured {
  border-color: var(--border-gold);
  background:
    linear-gradient(180deg, rgba(255, 184, 0, 0.05) 0%, transparent 40%),
    linear-gradient(180deg, var(--surface) 0%, #0c0f16 100%);
}
.plan--featured::before {
  background: var(--grad-gold);
  box-shadow: 0 0 14px rgba(255, 184, 0, 0.5);
  opacity: 1;
}
.plan--featured:hover {
  border-color: rgba(255, 184, 0, 0.5);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 184, 0, 0.15);
}
.plan-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.plan-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.2px;
  color: #fff;
  line-height: 1.3;
}
.plan-name span {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.6px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-top: 3px;
}
.badge {
  flex-shrink: 0;
  padding: 4px 9px;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: var(--r-full);
  white-space: nowrap;
  line-height: 1.4;
}
.badge--popular { background: var(--grad-fire); color: #fff; box-shadow: 0 0 14px rgba(255, 77, 0, 0.5); }
.badge--value { background: var(--grad-gold); color: #1a0f00; box-shadow: 0 0 14px rgba(255, 184, 0, 0.4); }
.plan-price {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
}
.price-main {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.8px;
  line-height: 1;
  background: linear-gradient(180deg, #ffffff 0%, #ffaa66 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.price-alt { font-size: 11.5px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.2px; }
.plan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.4px;
  color: #fff;
  transition: transform 0.15s var(--ease), filter 0.15s var(--ease), box-shadow 0.2s var(--ease);
}
.act svg { width: 13px; height: 13px; flex-shrink: 0; }
.act:hover { filter: brightness(1.1); transform: translateY(-1px); }
.act:active { transform: scale(0.97); }
.act--tg { background: var(--tg); box-shadow: 0 3px 12px rgba(42, 171, 238, 0.2); }
.act--wa { background: var(--wa); box-shadow: 0 3px 12px rgba(61, 220, 120, 0.18); }
/* ===== END OF CHUNK 1 ===== */
