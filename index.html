/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  /* Surfaces */
  --bg:          #07080c;
  --surface:     #0f1219;
  --surface-2:   #161a23;
  --surface-3:   #1c212c;

  /* Borders */
  --border:        rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.10);
  --border-red:    rgba(255, 42, 42, 0.22);
  --border-gold:   rgba(255, 184, 0, 0.32);

  /* Brand */
  --red:        #ff2a2a;
  --red-soft:   #ff5c5c;
  --red-deep:   #8b0000;
  --red-glow:   rgba(255, 42, 42, 0.45);
  --grad-red:   linear-gradient(135deg, #ff2a2a 0%, #8b0000 100%);
  --grad-gold:  linear-gradient(135deg, #ffd54a 0%, #ff8a00 100%);

  /* Accents */
  --gold:       #ffb800;
  --cyan:       #4da6ff;
  --tg:         linear-gradient(135deg, #2aabee 0%, #0088cc 100%);
  --wa:         linear-gradient(135deg, #3ddc78 0%, #128c7e 100%);

  /* Text */
  --text:       #ffffff;
  --text-muted: #8b93a5;
  --text-dim:   #5a6274;
  --text-faint: #3d4454;

  /* Radii */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-full: 999px;

  /* Motion */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Ambient background glow */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 42, 42, 0.16) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 105%, rgba(255, 42, 42, 0.08) 0%, transparent 60%);
}

/* Subtle grid texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
}

img { max-width: 100%; display: block; }

a { color: inherit; text-decoration: none; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ============================================================
   LAYOUT
   ============================================================ */
.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 18px 0;
}

@media (min-width: 560px) {
  .page { padding: 40px 24px 0; }
}

/* ============================================================
   HERO
   ============================================================ */
.hero {
  text-align: center;
  padding-bottom: 8px;
}

.logo-ring {
  position: relative;
  display: inline-block;
  margin-bottom: 22px;
  isolation: isolate;
}

.logo-ring::before {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #ff2a2a, #8b0000, #ff5c5c, #ff2a2a);
  filter: blur(20px);
  opacity: 0.55;
  z-index: -1;
  animation: spin 8s linear infinite;
}

.logo-ring::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1px solid rgba(255, 42, 42, 0.4);
  z-index: -1;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.logo {
  width: 116px;
  height: 116px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 42, 42, 0.5);
  background: var(--surface);
}

.brand {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 2.5px;
  line-height: 1.1;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 25%, #ff5c5c 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 16px rgba(255, 42, 42, 0.35));
  margin-bottom: 10px;
}

.tagline {
  font-size: 13.5px;
  color: var(--text-muted);
  max-width: 320px;
  margin: 0 auto 20px;
  line-height: 1.55;
}

/* Trust pills */
.trust {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.trust-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
}

.trust-pill svg {
  width: 12px;
  height: 12px;
  color: var(--red);
  flex-shrink: 0;
}

/* ============================================================
   CONTACT CTAs
   ============================================================ */
.contact {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 36px;
}

.btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 50px;
  padding: 14px 20px;
  border-radius: var(--r-md);
  font-size: 14.5px;
  font-weight: 800;
  letter-spacing: 0.3px;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.14);
  transition: transform 0.18s var(--ease), box-shadow 0.22s var(--ease), filter 0.18s var(--ease);
  overflow: hidden;
}

.btn svg { width: 19px; height: 19px; flex-shrink: 0; }

.btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
.btn:active { transform: translateY(0) scale(0.985); }

.btn-tg { background: var(--tg); box-shadow: 0 8px 24px rgba(42, 171, 238, 0.28); }
.btn-wa { background: var(--wa); box-shadow: 0 8px 24px rgba(61, 220, 120, 0.24); }

/* ============================================================
   SECTION HEADING
   ============================================================ */
.section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.section-head::before {
  content: '';
  width: 3px;
  height: 18px;
  background: var(--grad-red);
  border-radius: 2px;
  box-shadow: 0 0 10px var(--red-glow);
  flex-shrink: 0;
}

.section-title {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #fff;
}

/* ============================================================
   TABS
   ============================================================ */
.tabs {
  display: flex;
  gap: 4px;
  padding: 5px;
  background: rgba(15, 18, 25, 0.9);
  border: 1px solid var(--border-red);
  border-radius: var(--r-lg);
  margin-bottom: 20px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.tab {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 8px;
  border-radius: 11px;
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.7px;
  color: var(--text-dim);
  transition: all 0.25s var(--ease);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.tab-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-faint);
  transition: all 0.25s var(--ease);
  flex-shrink: 0;
}

.tab.is-active {
  background: var(--grad-red);
  color: #fff;
  box-shadow: 0 4px 18px rgba(255, 42, 42, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.tab.is-active .tab-dot {
  background: #fff;
  box-shadow: 0 0 8px #fff;
}

.tab:not(.is-active):hover {
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.03);
}

/* ============================================================
   PANELS
   ============================================================ */
.panel { display: none; }

.panel.is-active {
  display: block;
  animation: panelIn 0.35s var(--ease-out);
}

@keyframes panelIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   PLAN CARDS
   ============================================================ */
.plan {
  position: relative;
  background: linear-gradient(180deg, var(--surface) 0%, #0c0f16 100%);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 18px 16px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.22s var(--ease), box-shadow 0.22s var(--ease), transform 0.22s var(--ease);
}

.plan::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--grad-red);
  opacity: 0.85;
}

.plan:hover {
  border-color: var(--border-red);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 42, 42, 0.08);
  transform: translateY(-2px);
}

/* Featured (best value) */
.plan--featured {
  border-color: var(--border-gold);
  background:
    linear-gradient(180deg, rgba(255, 184, 0, 0.05) 0%, transparent 40%),
    linear-gradient(180deg, var(--surface) 0%, #0c0f16 100%);
}

.plan--featured::before {
  background: var(--grad-gold);
  box-shadow: 0 0 14px rgba(255, 184, 0, 0.5);
  opacity: 1;
}

.plan--featured:hover {
  border-color: rgba(255, 184, 0, 0.5);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 184, 0, 0.15);
}

/* Card header */
.plan-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.plan-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.2px;
  color: #fff;
  line-height: 1.3;
}

.plan-name span {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.6px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-top: 3px;
}

.badge {
  flex-shrink: 0;
  padding: 4px 9px;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: var(--r-full);
  white-space: nowrap;
  line-height: 1.4;
}

.badge--popular {
  background: var(--grad-red);
  color: #fff;
  box-shadow: 0 0 14px rgba(255, 42, 42, 0.45);
}

.badge--value {
  background: var(--grad-gold);
  color: #1a0f00;
  box-shadow: 0 0 14px rgba(255, 184, 0, 0.4);
}

/* Price */
.plan-price {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
}

.price-main {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.8px;
  line-height: 1;
  background: linear-gradient(180deg, #ffffff 0%, #9fc8ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.price-alt {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.2px;
}

/* Actions */
.plan-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.act {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.4px;
  color: #fff;
  transition: transform 0.15s var(--ease), filter 0.15s var(--ease), box-shadow 0.2s var(--ease);
}

.act svg { width: 13px; height: 13px; flex-shrink: 0; }
.act:hover { filter: brightness(1.1); transform: translateY(-1px); }

.act--tg { background: var(--tg); box-shadow: 0 3px 12px rgba(42, 171, 238, 0.2); }
.act--wa { background: var(--wa); box-shadow: 0 3px 12px rgba(61, 220, 120, 0.18); }

/* ============================================================
   HOW TO BUY
   ============================================================ */
.how {
  margin-top: 40px;
}

.steps {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.step {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 14px 16px;
  background: rgba(15, 18, 25, 0.6);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
}

.step:hover {
  border-color: var(--border-red);
  background: rgba(22, 26, 35, 0.7);
}

.step-num {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 900;
  color: #fff;
  background: var(--grad-red);
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(255, 42, 42, 0.35);
  margin-top: 1px;
}

.step-body {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.55;
}

.step-body strong {
  color: #fff;
  font-weight: 700;
}

/* ============================================================
   FAQ
   ============================================================ */
.faq {
  margin-top: 40px;
}

.faq-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.faq-item {
  background: rgba(15, 18, 25, 0.6);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: border-color 0.2s var(--ease);
}

.faq-item[open] {
  border-color: var(--border-red);
}

.faq-item summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  font-size: 13.5px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  list-style: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s var(--ease);
}

.faq-item summary::-webkit-details-marker { display: none; }

.faq-item summary:hover { background: rgba(255, 255, 255, 0.02); }

.faq-icon {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  position: relative;
  color: var(--red);
  transition: transform 0.25s var(--ease);
}

.faq-icon::before,
.faq-icon::after {
  content: '';
  position: absolute;
  background: currentColor;
  border-radius: 2px;
  transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
}

.faq-icon::before { top: 50%; left: 2px; right: 2px; height: 1.8px; transform: translateY(-50%); }
.faq-icon::after  { left: 50%; top: 2px; bottom: 2px; width: 1.8px; transform: translateX(-50%); }

.faq-item[open] .faq-icon { transform: rotate(180deg); }
.faq-item[open] .faq-icon::after { opacity: 0; }

.faq-answer {
  padding: 0 16px 15px;
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--text-muted);
  animation: panelIn 0.28s var(--ease-out);
}

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  position: relative;
  z-index: 1;
  width: 100%;

  margin: 0 auto;

}

@media (min-width: 560px) {

.footer::before {
  content: '';

.footer-links {

  flex-wrap: wrap;
  gap: 8px;

.footer-link {

  gap: 6px;

}

.footer-link svg { width: 13px; height: 13px; flex-shrink: 0; }

.footer-link:hover {
  color: #fff;
  border-color: var(--border-red);
  background: rgba(255, 42, 42, 0.06);
}

.disclaimer {
  font-size: 10.5px;
  line-height: 1.65;
  color: var(--text-faint);
  max-width: 380px;
  margin: 0 auto 14px;
}

.copyright {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.8px;
  color: var(--text-faint);
  text-transform: uppercase;
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .logo-ring::before { animation: none; }
}
</style>
